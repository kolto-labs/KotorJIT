name = "Current showcase example live predicates"
target = "k1"
[settings]
game_speed = 1.0
hang_seconds = 90
default_timeout = 120
load_timeout = 180

[[step]]
do = "load_save"
dir = "000001 - AUTOSAVE"
timeout = 180

[[step]]
wait = "module"
equals = "danm14aa"
timeout = 180

[[step]]
wait = "phase"
equals = "gameplay"
timeout = 180

[[step]]
do = "clear_auto_pause"

[[step]]
label = "real conscious Bastila party precondition"
do = "assert_lua"
code = "local b=nwscript.call(\"GetObjectByTag\",\"bastila\",0); return nwscript.call(\"GetIsObjectValid\",b)==1 and nwscript.call(\"IsObjectPartyMember\",b)==1 and nwscript.call(\"GetIsDead\",b)==0"
equals = true
poll = false
timeout = 60

[[step]]
do = "await_log"
pattern = "\\[arrival\\] dan"
minimum = 1
timeout = 120

[[step]]
screenshot = true
label = "Dantooine arrival text inspection"

[[step]]
do = "mark_log"

[[step]]
label = "meditation actual engine hook gives every member an active attack-effect delta"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); validation_effect_type=nwscript.call(\"GetEffectType\",nwscript.call(\"EffectAttackIncrease\",1,0)); function validation_count(o) local n=0; local e=nwscript.call(\"GetFirstEffect\",o); while nwscript.call(\"GetIsEffectValid\",e)==1 do if nwscript.call(\"GetEffectType\",e)==validation_effect_type then n=n+1 end; e=nwscript.call(\"GetNextEffect\",o) end; return n end; validation_party={}; for i=0,nwscript.call(\"GetPartyMemberCount\")-1 do local o=nwscript.call(\"GetPartyMemberByIndex\",i); validation_party[#validation_party+1]={id=o,before=validation_count(o)} end; nwscript.call(\"ExecuteScript\",\"k_def_combend01\",pc,0); nwscript.call(\"ExecuteScript\",\"k_def_attacked01\",pc,0); return #validation_party>=2"
equals = true
poll = false
timeout = 60

[[step]]
label = "independent active attack-effect counts increased on every party member"
do = "assert_lua"
code = "for _,r in ipairs(validation_party) do r.after=validation_count(r.id); if r.after<=r.before then return false end end; return true"
equals = true
poll = true
timeout = 20

[[step]]
do = "await_log"
pattern = "\\[meditation\\] round \\d+: steadied [23] of the party"
minimum = 1
timeout = 120

[[step]]
label = "meditation suppresses repeated attacked hook until end-of-round"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); local before={}; for _,r in ipairs(validation_party) do before[r.id]=validation_count(r.id) end; nwscript.call(\"ExecuteScript\",\"k_def_attacked01\",pc,0); for _,r in ipairs(validation_party) do if validation_count(r.id)>before[r.id] then return false end end; return true"
equals = true
poll = false
timeout = 60

[[step]]
label = "temporary meditation effect expires to baseline"
do = "assert_lua"
code = "for _,r in ipairs(validation_party) do if validation_count(r.id)>r.before then return false end end; return true"
equals = true
poll = true
timeout = 45

[[step]]
do = "mark_log"

[[step]]
label = "establish alignment baseline20"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); nwscript.call(\"SetGoodEvilValue\",pc,20); return nwscript.call(\"GetGoodEvilValue\",pc)==20"
equals = true
poll = false
timeout = 60

[[step]]
do = "advance_ticks"
ticks = 200
timeout = 180

[[step]]
do = "mark_log"

[[step]]
label = "cross alignment decade20 to35"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); nwscript.call(\"SetGoodEvilValue\",pc,35); return nwscript.call(\"GetGoodEvilValue\",pc)==35"
equals = true
poll = false
timeout = 60

[[step]]
do = "await_log"
pattern = "\\[conscience\\] \\+15, now 35"
minimum = 1
timeout = 120
maximum = 1

[[step]]
screenshot = true
label = "Alignment text inspection"

[[step]]
do = "mark_log"

[[step]]
label = "same-decade alignment change35 to36"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); nwscript.call(\"SetGoodEvilValue\",pc,36); return nwscript.call(\"GetGoodEvilValue\",pc)==36"
equals = true
poll = false
timeout = 60

[[step]]
do = "advance_ticks"
ticks = 200
timeout = 180

[[step]]
do = "await_log"
pattern = "\\[conscience\\]"
minimum = 0
timeout = 120
maximum = 0

[[step]]
do = "mark_log"

[[step]]
label = "wounded Bastila real low HP and stock damage hook"
do = "assert_lua"
code = "local b=nwscript.call(\"GetObjectByTag\",\"bastila\",0); nwscript.call(\"SetMinOneHP\",b,1); nwscript.call(\"ApplyEffectToObject\",0,nwscript.call(\"EffectDamage\",999,8,0),b,0); nwscript.call(\"ExecuteScript\",\"k_def_damage01\",b,0); return nwscript.call(\"GetCurrentHitPoints\",b)/nwscript.call(\"GetMaxHitPoints\",b)<=0.35"
equals = true
poll = false
timeout = 60

[[step]]
do = "await_log"
pattern = "\\[wounded\\] .*bastila.*below 35%"
minimum = 1
timeout = 120
maximum = 1

[[step]]
label = "repeat wounded hook still same low HP"
do = "assert_lua"
code = "local b=nwscript.call(\"GetObjectByTag\",\"bastila\",0); nwscript.call(\"ExecuteScript\",\"k_def_damage01\",b,0); return nwscript.call(\"GetCurrentHitPoints\",b)/nwscript.call(\"GetMaxHitPoints\",b)<=0.35"
equals = true
poll = false
timeout = 60

[[step]]
do = "await_log"
pattern = "\\[wounded\\] .*bastila.*below 35%"
minimum = 1
timeout = 120
maximum = 1

[[step]]
screenshot = true
label = "Wounded text inspection"

[[step]]
do = "mark_log"

[[step]]
do = "lua"
code = "nwscript.call(\"StartNewModule\",\"danm13\",\"\"); return true"
timeout = 60

[[step]]
wait = "module"
equals = "danm13"
timeout = 180

[[step]]
wait = "phase_any"
equals = ["gameplay", "dialog", "paused"]
timeout = 180

[[step]]
do = "advance_dialog"
until = "gameplay"
timeout = 120

[[step]]
do = "advance_ticks"
ticks = 60
timeout = 120

[[step]]
do = "await_log"
pattern = "\\[arrival\\] dan"
minimum = 0
timeout = 120
maximum = 0

[[step]]
do = "mark_log"

[[step]]
do = "lua"
code = "nwscript.call(\"StartNewModule\",\"manm26ad\",\"\"); return true"
timeout = 60

[[step]]
wait = "module"
equals = "manm26ad"
timeout = 180

[[step]]
wait = "phase_any"
equals = ["gameplay", "dialog", "paused"]
timeout = 180

[[step]]
do = "advance_dialog"
until = "gameplay"
timeout = 180

[[step]]
do = "await_log"
pattern = "\\[arrival\\] man"
minimum = 1
timeout = 120
maximum = 1

[[step]]
do = "clear_auto_pause"

[[step]]
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); local p=nwscript.call(\"GetPosition\",pc); validation_enemy=nwscript.call(\"CreateObject\",1,\"g_sithtroop01\",nwscript.call(\"Location\",{x=p.x+4,y=p.y,z=p.z},0),1); nwscript.call(\"ChangeToStandardFaction\",validation_enemy,1); return nwscript.call(\"GetIsObjectValid\",validation_enemy)==1"
equals = true

[[step]]
do = "clear_auto_pause"

[[step]]
do = "await_log"
pattern = "\\[alarm\\] .*raised the alarm"
minimum = 1
timeout = 120

[[step]]
do = "lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); nwscript.with_caller(pc,function() nwscript.call(\"ClearAllActions\"); nwscript.call(\"ActionAttack\",validation_enemy,0) end); return validation_enemy"
timeout = 60

[[step]]
do = "clear_auto_pause"

[[step]]
do = "await_log"
pattern = "\\[ahto\\] strike [1-9]\\d* witnessed on Manaan"
minimum = 1
timeout = 120

[[step]]
screenshot = true
label = "Manaan callout inspection"
