# KotorPhasor's actual build, not the generic starter template this file
# began as. Both game targets are 32-bit (see CMakeLists.txt's header), and
# the "Windows half" is cross-compiled from Linux with mingw-w64 rather than
# built natively with MSVC -- there is no MSVC-compatible code path anywhere
# in this project (GCC-specific attributes, a __thiscall bridge that only
# builds under GCC/mingw, no vcxproj). A windows-latest/cl job here would
# only ever fail, for reasons that have nothing to do with whether the code
# is correct, so this workflow builds on ubuntu-latest with two native
# compilers (gcc, clang) and cross-compiles the Windows DLL from both.
#
# Matches docs/user/install.md's documented recipe exactly, translated from
# that doc's Fedora/dnf package names to Ubuntu/apt equivalents.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same PR (or to main) supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        c_compiler: [gcc, clang]
        include:
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Install 32-bit and mingw-w64 toolchains
      # gcc-multilib/g++-multilib: the native halves (kp_image, kp_hooks,
      # libkphasor.so, every native test tool) are all built -m32, and
      # ubuntu-latest's default g++/clang++ only carry 64-bit headers.
      # g++-mingw-w64-i686 + binutils-mingw-w64-i686: cross-compiles
      # kphasor.dll and the proxy binkw32.dll.
      # luajit: configure-time find_program(... REQUIRED) in CMakeLists.txt,
      # src/api/model.cmake and src/api/animation.cmake; the example, model
      # and animation tests run under it. lua5.1: kpharness_world_test runs
      # the emitted probe through a plain `lua` interpreter.
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib \
          g++-mingw-w64-i686 binutils-mingw-w64-i686 \
          luajit lua5.1

    - name: Fetch LuaJIT
      # Not a submodule -- third_party/ is gitignored, same as a developer's
      # own checkout per docs/user/install.md. CMake's own custom command
      # copies this tree and builds it natively for libkphasor.so; the
      # Windows-target build below is needed separately for kphasor.dll,
      # which links a prebuilt PE archive rather than building one itself.
      run: git clone --branch v2.1 --depth 1 https://github.com/LuaJIT/LuaJIT third_party/luajit

    - name: Build LuaJIT for the Windows target
      # BUILDMODE=static matters: without it this only produces lua51.dll,
      # not libluajit.a, and CMakeLists' guard on that file silently skips
      # kphasor.dll rather than failing loudly. docs/user/install.md was
      # missing this flag too, until this same investigation caught it --
      # the documented recipe would never have produced kphasor.dll either.
      run: |
        make -C third_party/luajit \
          HOST_CC="gcc -m32" CROSS=i686-w64-mingw32- TARGET_SYS=Windows BUILDMODE=static

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config Release --output-on-failure
