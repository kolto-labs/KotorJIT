# L1 CAMERA DIAGNOSTIC. NON-ACCEPTANCE. One launch (KP_MAX_BOOT_ATTEMPTS=1), no F12, no scale change.
# Its media is never acceptance media. Generated by generate-l1.py; do not hand-edit.
name="L1 camera diagnostic, K1 danm14aa (NON-ACCEPTANCE, one launch, no F12)"
target="k1"
[settings]
game_speed=1.0
hang_seconds=90
default_timeout=45
load_timeout=600
shot_interval=0

[[step]]
do="load_save"
dir="000001 - AUTOSAVE"
timeout=600

[[step]]
wait="phase"
equals="gameplay"
timeout=600

[[step]]
do="clear_auto_pause"

[[step]]
do="advance_dialog"
until="gameplay"
timeout=120

[[step]]
label="V1 step 5 (verbatim): peaceful danm14aa, kp.camera present and available, original scale; fails early on a build without kp.camera"
do="assert_lua"
code="local q=nwscript.call; local p=q('GetFirstPC'); if not (kp.camera and kp.camera.capabilities) then error('kp.camera missing: wrong build') end; local cc=kp.camera.capabilities(); if cc.available~=true or cc.profile~='windows-k1-gog' then error('kp.camera unavailable: '..tostring(cc.profile)) end; if q('GetModuleFileName')~='danm14aa' or q('GetIsObjectValid',p)~=1 or q('GetIsDead',p)==1 or q('GetIsInCombat',p)~=0 or q('GetIsInConversation',p)~=0 or not kp.model.capabilities().available then return false end; t7_original=assert(kp.model.snapshot(p)); t7_module=q('GetModuleFileName'); t7_area=q('GetArea',p); t7_locals={}; for i=5,9 do t7_locals[i]=q('GetLocalNumber',p,i) end; T7={q=0.001,p=0.01,cfg=0.0001,face=0.1,pos=0.01}; function t7_cam(soft) local function bad(m) if soft then return nil,m end; error(m) end; local c,msg,code=kp.camera.snapshot(); if not c then return bad('camera snapshot failed: '..tostring(code)..' '..tostring(msg)) end; if c.behavior~='chase' then return bad('camera behavior '..tostring(c.behavior)..' vtable '..tostring(c.behavior_vtable)) end; if c.pending_style~=-1 then return bad('camera style reapply pending '..tostring(c.pending_style)) end; return {mode=c.mode,module=c.module,camera=c.camera,behavior_ptr=c.behavior_ptr,distance=c.distance,speed=c.speed,pitch=c.pitch,height=c.height,dolly=c.dolly,style_row=c.style_row,base_distance=c.base_distance,base_view_angle=c.base_view_angle,q=c.raw_28_unverified,p=c.raw_38_unverified,p2=c.raw_50_unverified} end; function t7_camdev(a,b) for _,k in ipairs{'mode','module','camera','behavior_ptr','dolly','style_row'} do if a[k]~=b[k] then return false,k..' changed '..tostring(a[k])..'->'..tostring(b[k]) end end; for _,k in ipairs{'distance','speed','pitch','height','base_distance','base_view_angle'} do if math.abs(a[k]-b[k])>T7.cfg then return false,k..' changed '..a[k]..'->'..b[k] end end; local mq,mp=0,0; for i=1,4 do mq=math.max(mq,math.abs(a.q[i]-b.q[i])) end; for i=1,3 do mp=math.max(mp,math.abs(a.p[i]-b.p[i]),math.abs(a.p2[i]-b.p2[i])) end; if mq>T7.q then return false,'raw_28 moved '..mq end; if mp>T7.p then return false,'raw_38/raw_50 moved '..mp end; return true,'same',mq,mp end; function t7_pose() local q=nwscript.call; local p=q('GetFirstPC'); local v=q('GetPosition',p); return {f=q('GetFacing',p),x=v.x,y=v.y,z=v.z} end; function t7_posedev(a,b) if math.abs(a.f-b.f)>T7.face then return false,'PC facing changed' end; for _,k in ipairs{'x','y','z'} do if math.abs(a[k]-b[k])>T7.pos then return false,'PC moved' end end; return true end; function t7_stable(where) local ok,why=t7_camdev(t7_cam0,t7_cam()); if not ok then error('camera moved at '..where..': '..why) end; local pk,pw=t7_posedev(t7_pose0,t7_pose()); if not pk then error(pw..' at '..where) end; return true end; return math.abs(t7_original.base-1)<0.001"
equals=true

[[step]]
label="L1 harness library (no game effect)"
do="assert_lua"
code="L1={}; L1K={'behavior','mode','pending_style','module','camera','behavior_ptr','behavior_vtable','distance','speed','pitch','height','dolly','base_distance','base_view_angle','style_row'}; L1CFG={'distance','speed','pitch','height','base_distance','base_view_angle'}; L1ID={'behavior','mode','pending_style','module','camera','behavior_ptr','dolly','style_row'}; function l1_g(x) if type(x)=='number' then return ('%.9g'):format(x) end; return tostring(x) end; function l1_take(tag) local q=nwscript.call; local p=q('GetFirstPC'); local v=q('GetPosition',p); local r={t=os.time(),pc={x=v.x,y=v.y,z=v.z,f=q('GetFacing',p)}}; local ok,c,msg,code=pcall(kp.camera.snapshot); if not ok then r.err='pcall '..tostring(c) elseif not c then r.err=tostring(code)..' '..tostring(msg) else local s={}; for _,k in ipairs(L1K) do s[k]=c[k] end; for _,k in ipairs{'raw_28_unverified','raw_38_unverified','raw_50_unverified'} do local t=c[k]; if t then s[k]={t[1],t[2],t[3],t[4]} end end; r.c=s end; L1[tag]=r; return r end; function l1_geo(r,k) local v=r.c and r.c[k]; if not v then return 'nil','nil' end; local dx,dy=v[1]-r.pc.x,v[2]-r.pc.y; return l1_g(math.sqrt(dx*dx+dy*dy)),l1_g(v[3]-r.pc.z) end; function l1_part(r,part) local c=r.c; if part=='e' then return ('pc=%s,%s,%s f=%s t=%d'):format(l1_g(r.pc.x),l1_g(r.pc.y),l1_g(r.pc.z),l1_g(r.pc.f),r.t) end; if not c then return 'snapshot failed: '..tostring(r.err):sub(1,120) end; if part=='a' then return ('beh=%s mode=%s ps=%s dolly=%s sr=%s vt=%s bp=%s cam=%s mod=%s'):format(tostring(c.behavior),l1_g(c.mode),l1_g(c.pending_style),l1_g(c.dolly),l1_g(c.style_row),tostring(c.behavior_vtable),tostring(c.behavior_ptr),tostring(c.camera),tostring(c.module)) end; if part=='b' then return ('d=%s s=%s pi=%s h=%s bd=%s fov=%s'):format(l1_g(c.distance),l1_g(c.speed),l1_g(c.pitch),l1_g(c.height),l1_g(c.base_distance),l1_g(c.base_view_angle)) end; local q,p,p2=c.raw_28_unverified or {},c.raw_38_unverified or {},c.raw_50_unverified or {}; if part=='c' then return ('q28=%s,%s,%s,%s'):format(l1_g(q[1]),l1_g(q[2]),l1_g(q[3]),l1_g(q[4])) end; if part=='d' then return ('p38=%s,%s,%s p50=%s,%s,%s'):format(l1_g(p[1]),l1_g(p[2]),l1_g(p[3]),l1_g(p2[1]),l1_g(p2[2]),l1_g(p2[3])) end; local r38,z38=l1_geo(r,'raw_38_unverified'); local r50,z50=l1_geo(r,'raw_50_unverified'); return ('r38=%s dz38=%s r50=%s dz50=%s'):format(r38,z38,r50,z50) end; function l1_rec(tag,part) local ok,s=pcall(function() local r=L1[tag]; if not r then return 'no reading' end; return l1_part(r,part) end); return tag..part..' '..(ok and s or ('record error: '..tostring(s):sub(1,120))) end; function l1_maxd(a,b,n) if not (a and b) then return nil end; local m=0; for i=1,n do if not (a[i] and b[i]) then return nil end; m=math.max(m,math.abs(a[i]-b[i])) end; return m end; function l1_delta(a,b) local ok,s=pcall(function() local A,B=L1[a],L1[b]; if not (A and B and A.c and B.c) then return 'n/a (snapshot missing)' end; local same=1; for _,k in ipairs(L1ID) do if A.c[k]~=B.c[k] then same=0 end end; local dc=0; for _,k in ipairs(L1CFG) do if A.c[k] and B.c[k] then dc=math.max(dc,math.abs(A.c[k]-B.c[k])) else dc=nil; break end end; local f=function(x) return x and ('%.4g'):format(x) or 'nil' end; return ('idsame=%d dcfg=%s dq=%s dp38=%s dp50=%s dpc=%s df=%s dt=%d'):format(same,f(dc),f(l1_maxd(A.c.raw_28_unverified,B.c.raw_28_unverified,4)),f(l1_maxd(A.c.raw_38_unverified,B.c.raw_38_unverified,3)),f(l1_maxd(A.c.raw_50_unverified,B.c.raw_50_unverified,3)),f(l1_maxd({A.pc.x,A.pc.y,A.pc.z},{B.pc.x,B.pc.y,B.pc.z},3)),f(math.abs(A.pc.f-B.pc.f)),B.t-A.t) end); return b..' vs '..a..' '..(ok and s or ('delta error: '..tostring(s):sub(1,120))) end; return true"
equals=true

