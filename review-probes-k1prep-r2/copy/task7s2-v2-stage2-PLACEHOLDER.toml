code="local q=nwscript.call; local p=q('GetFirstPC'); if q('GetLocalNumber',p,8)~=0 then error('scene failed') end; t7_stable('phase 1 poll'); if q('GetLocalNumber',p,6)~=1 then return false end; local c=assert(kp.model.snapshot(p)); return q('GetModuleFileName')==t7_module and q('GetArea',p)==t7_area and q('GetIsInCombat',p)==0 and q('GetIsInConversation',p)==0 and c.id==t7_original.id and c.model==t7_original.model and c.creature==t7_original.creature and math.abs(c.base-0.35)<0.001 and math.abs(c.effective-t7_original.effective/t7_original.base*0.35)<0.001"
