# The first Endar dialogue reached through its real prerequisite portal.
# This is deliberately a state-transition proof, not a video proof: the full
# campaign recorder is only run after the route is established.
name = "k1 Endar: traverse first door and open Trask dialogue"
target = "k1"
schema_version = 1

[resources.endar_walkmesh]
kind = "walkmesh"
source = "data/models.bif/m01aa_01a.wok"
file = "harness-resources/m01aa_01a.wok"
size = 26404
sha256 = "afd30f4154e5761bcd41223bc000b21422650928c7a5e56691bc2dffad4c88ba"

[execution]
load_timeout = 300
default_timeout = 75

[[step]]
do = "load_save"
dir = "000001 - AUTOSAVE"

[[step]]
wait = "phase"
equals = "gameplay"
timeout = 300

[[step]]
label = "ordinary move/open end_door01 with state proof"
do = "door_transaction"
module = "end_m01aa"
type = 8
tag = "end_door01"
position = [21.1225, 20.7130, -1.3158]
position_tolerance = 0.25
resource = "endar_walkmesh"
walkmesh_face = 13
walkmesh_path = [12, 13]
walkmesh_approach_face = 12
walkmesh_approach_centroid = [19.914662679036457, 20.194860458374023, -1.274999976158142]
walkmesh_far_centroid = [20.32586733500163, 21.70310910542806, -1.274999976158142]
walkmesh_min_projection = 0.5
destination = [20.32586733500163, 21.70310910542806, -1.274999976158142]
destination_tolerance = 0.75
timeout = 45

[[step]]
do = "lua"
timeout = 20
code = "local pc=nwscript.call('GetFirstPC'); local t=nwscript.call('GetObjectByTag','end_trask',0); if nwscript.call('GetIsObjectValid',t)~=1 then error('Trask missing after portal') end; kp.as(pc,function() nwscript.call('ActionForceMoveToObject',t,1,0.75,30.0) end)"

[[step]]
do = "sleep"
seconds = 30

[[step]]
do = "lua"
timeout = 20
code = "local pc=nwscript.call('GetFirstPC'); local t=nwscript.call('GetObjectByTag','end_trask',0); local d=nwscript.call('GetDistanceBetween',pc,t); if d>1.25 then error(string.format('Trask approach incomplete: %.3f',d)) end; kp.as(pc,function() nwscript.call('ActionStartConversation',t,'') end); return {distance=d,pc=pc,trask=t}"

[[step]]
wait = "phase"
equals = "dialog"
timeout = 75

[[step]]
do = "quit"
