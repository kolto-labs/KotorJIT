# Cursed demo: footlocker blaster
# Deploys scripts/examples/cursed/110_footlocker_blaster.lua. Arena: Endar
# room3 + six Sith in a ring. The PC must hold a ranged weapon (checkpoint
# gear or a spawned blaster). Gates on armed flag, ammo local, and >= 3
# knockback impacts (PC local number 7).
#
# assert_lua chunks that touch the VM wrap GetFirstPC in pcall and return
# false while the trusted script context is still settling — poll=true then
# retries instead of failing the route on a transient "command slot" miss.
name = "cursed: footlocker blaster"
target = "k1"

[settings]
game_speed = 1.0
hang_seconds = 90
default_timeout = 240
load_timeout = 600

[[step]]
do = "load_checkpoint"
name = "endar_room3"
timeout = 600

[[step]]
wait = "phase"
equals = "gameplay"
timeout = 600

[[step]]
label = "counter plumbing: warm the harness Lua VM / command slot"
do = "assert_lua"
code = "local ok,pc=pcall(nwscript.call,'GetFirstPC'); if not ok or not pc then return false end; nwscript.call('SetLocalNumber',pc,7,42); nwscript.call('SetLocalNumber',pc,6,17); local a,b=nwscript.call('GetLocalNumber',pc,7),nwscript.call('GetLocalNumber',pc,6); nwscript.call('SetLocalNumber',pc,7,0); nwscript.call('SetLocalNumber',pc,6,0); return a==42 and b==17 and nwscript.call('GetLocalNumber',pc,7)==0"
equals = true
poll = true
timeout = 120

[[step]]
do = "clear_auto_pause"

[[step]]
label = "finish Trask tutorial bark"
do = "advance_dialog"
until = "gameplay"
timeout = 120

[[step]]
label = "ensure PC has a ranged weapon in the right hand"
do = "assert_lua"
code = "local ok,pc=pcall(nwscript.call,'GetFirstPC'); if not ok or not pc then return false end; local rh=nwscript.call('GetItemInSlot',4,pc); if rh and nwscript.call('GetIsObjectValid',rh)==1 and nwscript.call('GetWeaponRanged',rh)==1 then return true end; local gun=nwscript.call('CreateItemOnObject','g_w_blstrpstl001',pc,1); if gun and nwscript.call('GetIsObjectValid',gun)==1 then nwscript.call('ActionEquipItem',gun,4) end; rh=nwscript.call('GetItemInSlot',4,pc); return rh~=nil and nwscript.call('GetIsObjectValid',rh)==1 and nwscript.call('GetWeaponRanged',rh)==1"
equals = true
poll = true
timeout = 90

[[step]]
label = "curse armed (PC local 5 == 1)"
do = "assert_lua"
code = "local ok,pc=pcall(nwscript.call,'GetFirstPC'); if not ok or not pc then return false end; return nwscript.call('GetLocalNumber',pc,5)==1"
equals = true
poll = true
timeout = 120

[[step]]
label = "default ammo published (local 6 == #footlker001 == 11)"
do = "assert_lua"
code = "local ok,pc=pcall(nwscript.call,'GetFirstPC'); if not ok or not pc then return false end; return nwscript.call('GetLocalNumber',pc,6)==11"
equals = true
poll = true
timeout = 30

[[step]]
label = "arena: six Sith troopers in a ring"
do = "assert_lua"
code = "local ok,pc=pcall(nwscript.call,'GetFirstPC'); if not ok or not pc then return false end; local p=nwscript.call('GetPosition',pc); if type(p)~='table' then return false end; local n=0; for i=1,6 do local a=i/6*2*math.pi; local loc=nwscript.call('Location',{x=p.x+4.5*math.cos(a),y=p.y+4.5*math.sin(a),z=p.z},0); local c=nwscript.call('CreateObject',1,'g_sithtroop01',loc,1); if nwscript.call('GetIsObjectValid',c)==1 then nwscript.call('ChangeToStandardFaction',c,1); n=n+1 end end; return n==6"
equals = true
poll = true
timeout = 60

[[step]]
label = "fight while footlockers fly"
do = "clear_room"
radius = 40
grace = 10
timeout = 300

[[step]]
label = "at least three footlocker impacts with knockback"
do = "assert_lua"
code = "local ok,pc=pcall(nwscript.call,'GetFirstPC'); if not ok or not pc then return false end; return nwscript.call('GetLocalNumber',pc,7)>=3"
equals = true
poll = true
timeout = 180
