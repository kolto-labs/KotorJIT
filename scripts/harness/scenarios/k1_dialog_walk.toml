# k1 dialog walk: every reply of the first node of Trask's opening
# conversation, rolled back between picks. The autosave is the rollback
# point; the conversation is started by engine call from the PC, replies
# are consumed through the conversation manager, and each pick waits for
# the node to change or the conversation to end.
name = "k1 endar spire: walk trask's first node"
target = "k1"

[settings]
load_timeout = 300
default_timeout = 90

[[step]]
do = "load_save"
dir = "000001 - AUTOSAVE"

[[step]]
wait = "phase"
equals = "gameplay"
timeout = 300

[[step]]
do = "walk_dialog"
save = "000001 - AUTOSAVE"
# end_trask is authored at (22.8836937,20.6108017,-1.2750006) in
# end_m01aa.mod/m01aa.git.  Queue the normal approach action first: a direct
# conversation request from the autosave PC at (10.55,15.70,-1.09) never
# enters dialog because the actor is out of interaction range.
start = "local trask=nwscript.call('GetObjectByTag','end_trask', 0); kp.as(nwscript.call('GetFirstPC'), function() nwscript.call('ActionMoveToObject',trask,1,0.75); nwscript.call('ActionStartConversation',trask, '') end)"
max_replies = 9
timeout = 90

[[step]]
screenshot = true
label = "after_walk"
