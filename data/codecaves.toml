# KotorPhasor codecave manifest.
#
# A codecave is a span of genuinely unused bytes inside an executable
# section -- compiler alignment padding between two real functions (a run of
# 0xCC int3 fill after MSVC, sometimes 0x90 NOP), or unused space at the end
# of a section before the next one begins. A script finds one at runtime with
# kotor.mem.findsig(pattern) -- see docs/user/codecaves.md -- and writes into
# it with kotor.mem.write*, which this codebase leaves deliberately
# unrestricted for executable sections (src/api/memory.hpp).
#
# ADDRESSES NEVER APPEAR HERE AS THE LOOKUP MECHANISM. Each entry's `sig` is
# what a script actually calls findsig with. The `addr` fields under
# `[[cave.verified]]` are NOT read by anything -- they document the exact VA
# that sig resolved to on the specific binary it was verified against, for a
# human reading this file. This is the opposite convention from
# data/hooksites.toml (logical name -> per-build resolved address table):
# a codecave's whole value is that one signature can work unmodified across
# every build where the surrounding bytes happen to match, which a resolved-
# per-build address table would defeat.
#
# Every entry below was verified two ways before being written down:
#   1. sig, scanned with this project's own findsig semantics (hex string,
#      '?' is a per-NIBBLE wildcard, not a per-byte one) against the real
#      binary's executable section(s), matches EXACTLY ONCE.
#   2. The `size` bytes starting at sig_match_address + len(sig)/2 are a
#      single uniform repeated byte (0xCC or 0x90), confirmed by reading the
#      real file, not inferred from the RE corpus's function-size field alone
#      -- that field undercounted a function's real end by a few bytes often
#      enough that trusting it produced false gaps that were actually still
#      inside the previous function's own tail instructions.
#
# Only KOTOR builds this runtime can currently install hooks on were
# searched (see tools/gen_address_tables.py's BUILDS, "installable": true):
# k1_gog_103, k2_gog_aspyr, k2_steam_aspyr. k2_steam_linux (the ELF build)
# was searched too and is a documented dead end below, not an oversight.
#
# 39 caves total, in two passes. The first pass found a handful by hand; the
# second was exhaustive -- every 12+ byte run of 0xCC or 0x90 across each
# binary's whole .text was enumerated directly from the raw file (not
# inferred from the corpus's function-size field, for the reason in point 2
# above), then narrowed to the subset anchored on a real, namespace-qualified
# function name. Each build's section below states exactly how many
# candidates that exhaustive scan found and how many were real-name-anchored;
# what appears here is a curated, individually re-verified sample of that
# set, not the whole thing -- a script picking by theme has real choices
# without this file becoming a database dump.

[meta]
version = 1

# --- KOTOR 1 GOG/Steam Windows -----------------------------------------------
#
# k1_steam_103 and k1_steam_103_unpacked's .text is byte-identical to
# k1_gog_103's once deciphered (see tools/gen_address_tables.py's own note,
# "828/828 pages" -- docs/steam-gog-equivalence.md), so both signatures below
# apply unmodified to all three K1 builds. Verified directly only against
# k1_gog_103's raw .exe; the other two were not independently re-verified,
# since the identical-.text claim is this project's own established fact,
# not a new one from this pass.

[[cave]]
name    = "k1.after_static_dispose_requested_model_list"
purpose = "Large cave: the unused tail of .text before .rdata begins."
size    = 3632
fill    = 0x00
sig     = "568bf1740ee8eed8eaff56e8c8e1fbff83c4045ec3909090"
note    = """The last 24 bytes of staticDisposeRequestedModelList (K1's Resource
Manager cleanup path) plus its 3-byte NOP alignment tail. The cave itself is
zero-filled, not 0xCC -- MSVC used 0x00 for this particular section-boundary
pad rather than its usual 0xCC per-function pad. findsig(sig) returns the
start of this 24-byte sequence; the cave begins at that address + 24 (0x18)
bytes, i.e. right after the trailing 0x909090."""

[[cave.verified]]
build = "k1_gog_103"
addr  = "0x0073C1D0"   # findsig(sig) + 0x18
sig_match_addr = "0x0073C1B8"

