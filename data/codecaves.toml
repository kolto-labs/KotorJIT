# --- KOTOR 2 Steam Aspyr Windows ----------------------------------------------
#
# This build is only 57% natively named (see PR history on
# tools/gen_address_tables.py), and almost none of that is game-engine code --
# it is mostly MSVC/MFC/ATL runtime library symbols. GetMargins below is one
# of those library functions, not KOTOR-specific code; it is still a real,
# individually verified cave, just not a thematically meaningful one the way
# the K1/K2-GOG entries above are.

[[cave]]
name    = "k2_steam.after_get_margins"
purpose = "Small cave, after an MFC CWnd::GetMargins accessor (library code, not engine-specific)."
size    = 15
fill    = 0xCC
sig     = "fc05b00000008b4d088b1089118b50048951048b50088951088b400c89410c8b45088be55dc20400"
note    = """The short (16-byte) form of this signature matched 4 different trivial
getter functions in this binary -- ret-pattern collision, not a real ambiguity
in the cave itself. Extended to 40 bytes of leading context to reach a unique
match; findsig(sig) + 40 (0x28) bytes = cave start."""

[[cave.verified]]
build = "k2_steam_aspyr"
addr  = "0x00459771"
sig_match_addr = "0x00459749"

# --- KOTOR 2 Linux ELF: no viable cave found ----------------------------------
#
# Checked and rejected, not overlooked. This build's .text has essentially no
# compiler alignment padding to exploit: a full byte-run scan across .text
# (plus the two Bink codec sections) found exactly one run of a single
# repeated byte at 12+ bytes (13 bytes of 0x90 at the very end of .text,
# immediately before the next section begins) and nothing else -- GCC on this
# build does not leave per-function padding the way MSVC does on the Windows
# builds above, and this binary is also more heavily stripped (1826/14743
# functions named) than any of the Windows targets, which limits how
# confidently a candidate could be anchored even if one existed. No entry is
# written for this build rather than forcing a low-confidence one.
