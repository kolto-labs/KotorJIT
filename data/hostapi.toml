  { name = "occurrence", type = "int", optional = true, default = "0" },
]
returns = "address"
failure = "nil"
on_failure = "nil when the pattern does not occur that many times"
requires = "image"
mechanism = "scan of the parsed executable sections from src/image"
doc = """Byte-signature search, '?' being a nibble wildcard, so '4?' matches any
