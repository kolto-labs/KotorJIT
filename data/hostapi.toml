# Native API catalog, including proposed facilities not yet bound.
# See docs/user/api-status.md for implementation status. API version 2 exposes
# native facilities only under kp; legacy alias annotations are no longer exports.
#
# The mirror image of data/events.toml. That file says what the game calls in a
# script; this one says what a script can call in the game. Both are read by a
# generator, neither is read at runtime:
#
#   tools/gen_hostapi_glue.py turns this into:
#     src/generated/hostapi.inc      the name -> C function registration table,
#                                    and the doc strings
#                                    the runtime reports in error messages
#     docs/lua-api-host.md           the reference script authors read
#
# The 769 callable NWScript routines are NOT listed here one by one. They are
# already data in data/routines/<game>.json and already generate a C++ table.
# One row below describes the whole family; adding a routine stays a change to
# that file.
#
# ============================================================================
# THE FOUR LAYERS, AND WHY THERE ARE FOUR
# ============================================================================
#
#   nwscript.call(name, ...) the engine's own routines. Safest: the engine does
#                            its own bookkeeping, and anything a game script can
#                            do a Lua script can now do.
#   kp.obj.*                object identity and lookup. Ids in, ids out.
#   kp.struct.*             named, size-asserted field access on engine structs.
#                           Replaces the base+offset idiom with something that
#                           can tell you that you spelled the field wrong.
#   kp.mem.*                raw typed reads and writes at an address. The escape
#                           hatch. Present because every reference script uses
#                           it and because the typed layer will always lag the
#                           game.
#
# A script should reach for the highest layer that answers its question. The
# lower layers are not deprecated, they are just less protected, and each entry
# below says exactly how much less.
#
# ============================================================================
# WHAT IS GUARDED, AND WHAT IS NOT
# ============================================================================
#
# Guarded, on every call:
#
#  1. Address range. Every raw read and write asks the platform layer whether
#     the whole span is mapped, and for a write whether the page can be made
#     writable. A failure raises a Lua error naming the size and the address.
#     It never returns nil, because a nil that means "bad address" is
#     indistinguishable from a nil that means "the field is zero".
#  2. The null page. Writes below 0x10000 are refused outright. That address
#     range is how a stale pointer usually presents.
#  3. Code. Writes that land in an executable section are refused unless the
#     script sets `allow_code_writes = true` at chunk scope, next to `priority`.
#     A bad data write corrupts one object and shows up where you did it; a bad
#     code write corrupts the instruction stream and shows up somewhere else
#     entirely. Patching code is what data/hooksites.toml and the hook engine
#     are for, and they verify expected bytes first.
#  4. Our own bytes. Writes into an installed trampoline or a patched prologue
#     are refused regardless of the opt-in. The hook registry knows those spans.
#
#     Items 3 and 4 describe kp.mem.allow_code_writes below, which is spec
#     only: src/api/memory.hpp's own header comment argues against building
#     it -- "There is no null-page refusal, no code-section opt-in, no
#     allow-list... A guard that refuses the write only moves the argument."
#     -- and the write funnel in memory.cpp has no such gate today. That is
#     the module's own considered stance, not an oversight, so this spec
#     entry stays unbuilt rather than being implemented against it. Read
#     this section as the intended surface, not current behavior, same as
#     every other entry elsewhere in this file marked "Spec only" in
#     docs/user/api-status.md.
#  5. Object liveness. A typed view holds an object id, not a pointer. It
#     re-resolves on first use in a new tick, so a view of a destroyed object
#     raises rather than reading freed memory. This is the single largest
#     safety difference from keeping a bare address across frames and finding
#     out the hard way.
#  6. Field names. Typed access is checked against the generated layout at
#     access time. `view.positon` raises and names the struct; it does not read
#     offset zero and it does not quietly return nil.
#  7. Field extent. A typed write is bounds-checked against the field's declared
#     size and refused if it would straddle the end of the struct.
#  8. Field confidence. Fields the RE corpus marks `med` or `low` are readable
#     but not writable unless the script calls `kp.struct.allow_unverified_writes(true)`.
#     Eleven fields in the K1 set are `low` and fifty-six are `med`; writing one
#     of those is writing to an offset nobody has confirmed. The other 1460 carry
#     no marking and are treated as high. That default is load-bearing, so it is
#     stated rather than assumed: those fields come from a walk whose field names
#     and running offsets agree all the way to the struct's asserted size. A
#     layout that cannot make that claim has to mark its fields.
#  9. Routine calls. Arity and types are checked, the VM binding is checked, the
#     marshallers the signature needs are checked, and the VM stack depth is
#     compared before and after. A depth mismatch disables the whole bridge for
#     the rest of the session and says so, because continuing to push arguments
#     onto a stack we have already corrupted turns one bad call into a crash
#     with no relation to its cause.
#
# Not guarded, deliberately:
#
#  * Meaning. Writing 0 into current_hp, or 47 into faction_id, is a legal
#    write of a legal value to a real field. There is no oracle for "sane", and
#    inventing one means inventing rules we have not verified. The answer is
#    that the typed layer and the engine routines are easier to use than the raw
#    ones, not that the raw ones are policed.
#  * Stale-but-mapped addresses in kp.mem.*. Reading a freed object's old
#    address succeeds and returns rubbish. That is exactly the hazard the typed
#    layer removes, which is why the typed layer exists.
#  * The engine's own preconditions behind a routine call. nwscript.call goes through
#    the same dispatch a game script does and gets the same treatment.
#
# The backstop under all of it is KP_HOOK_GUARD: script code runs inside a hook
# body, so a fault that gets past every check above is caught, logged, and takes
# that hook site out of service instead of killing the process. It is the last
# resort and not the first line, because a longjmp skips every destructor
# between the fault and the recovery point. Everything above exists so the
# backstop stays unused.
#
# ============================================================================
# HOW A FUNCTION REPORTS FAILURE
# ============================================================================
#
# `failure` is one of:
#   never    cannot fail once its arguments type-check
#   nil      returns nil, and nil means exactly the documented thing
#   false    returns false
#   empty    returns an empty table
#   error    raises a Lua error, which the host's pcall turns into a script
#            error against the calling script's budget
#
# `on_failure` says what the nil means, or what the message reads like. A
# function whose failure is `nil` never also raises for the same condition, and
# one whose failure is `error` never returns a sentinel. Mixing the two is how
# a lookup ends up returning nil in one place and raising in another for the
# same bad id.
#
# `requires` says what must already be true for the call to work:
#   none          always available, including before the game is identified
#   image         needs the parsed game image (module base, sections)
#   vm            needs the VM binding, which resolves during hook install
#   server_tick   needs the CServerExoAppInternal receiver, which is captured by
#                 the app.server_main_loop detour. Returns its documented
#                 failure value before the first tick of a loaded game.
#
# Compatibility aliases were removed in API version 2.

[meta]
version = 1
game = "k1"
source = "hand-written; nwscript.call dispatches routines generated from data/routines/<game>.json"
struct_source = "data/structs/<game>.json"

# =============================================================================
# memory -- raw typed access at an address
# =============================================================================
# The numeric readers take (address) or (address, offset), so readbyte(a, 3) and
# readbyte(a + 3) are the same call. Scripts use both forms.
#
# All ten raise on an unmapped span rather than returning nil.

[[function]]
lua_name = "kp.mem.readbyte"
module = "memory"
params = [
  { name = "address", type = "address" },
  { name = "offset", type = "int", optional = true, default = "0" },
]
returns = "int"
failure = "error"
on_failure = "invalid read: 1 bytes from 0xXXXXXXXX"
requires = "none"
mechanism = "page-checked load of uint8"
doc = "Reads one unsigned byte, 0 to 255."
confidence = "high"

