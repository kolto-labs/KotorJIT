# =============================================================================
# routines -- the bridge to the engine's own 769
# =============================================================================

[[function]]
lua_name = "nwscript.call"
module = "routines"
family = true
family_source = "data/routines/<game>.json"
params = [{ name = "name", type = "string" }]
variadic = true
returns = "any"
failure = "error"
on_failure = """'GetPosition needs vm.stack_pop_vector, which did not resolve
on this build'; 'GetName expects at least 1 argument (got 0)';
'nwscript.call: unknown routine X for the selected game'"""
requires = "vm"
mechanism = """CSWVirtualMachineCommands::ExecuteCommand, reached through the runtime
function-pointer table at +0x0C that vm.execute_command indexes. Arguments are
pushed onto the VM stack in reverse declaration order and the result is popped."""
doc = """Every supported engine routine is callable only through this dispatcher:
nwscript.call("GetModule") and nwscript.call("SendMessageToPC",
nwscript.call("GetFirstPC"), "hello"). 769 of K1's 772 and 803 of
K2's 877. Arguments follow the declaration order in the game's own nwscript.nss
and trailing defaulted parameters may be omitted.

Names, not ids. The id is an annotation in this file; register_all exposes one
dispatcher, K2's ids differ from K1's, and eight K1 ids have conflicting names between
nwscript.nss and the engine's own enum.

How the types cross:

  int, float, string, object   plain Lua values.
  vector                       a table { x =, y =, z = }, both directions. The VM
                               has dedicated StackPushVector/StackPopVector, so
                               this is one push, not three.
  effect, event, location,     an opaque userdata. Hold it, pass it back, do not
  talent                       index it. Four of them and no more: NWN's fifth,
                               itemproperty, does not exist in KOTOR, and pushing
                               its type id would be rejected by the VM.

Degrading honestly on a build where the optional marshallers are missing:
vm.stack_push_vector, vm.stack_pop_vector, vm.stack_push_engine_structure and
vm.stack_pop_engine_structure are all `required = false` in data/hooksites.toml.
If they do not resolve, the 22 vector routines and the 140 engine-struct routines
are uncallable while the other 607 still work. The dispatcher raises a message
naming the missing site."""
confidence = "high"

[[function]]
lua_name = "nwscript.call(\"AssignCommand\", ...)"
module = "routines"
params = [
  { name = "object_id", type = "object" },
  { name = "action", type = "any" },
]
returns = "nothing"
failure = "error"
on_failure = "'AssignCommand takes a script closure and cannot be called from Lua. Use kp.as(object, function() ... end).'"
requires = "none"
mechanism = "the dispatcher rejects this excluded catalog name before VM dispatch"
doc = """Calling it through nwscript.call explains the exclusion. Its `action` parameter is
STORE_STATE bytecode the NWScript compiler builds, and nothing outside the VM can
construct one. kp.as does the same job by retargeting OBJECT_SELF."""
confidence = "high"

[[function]]
lua_name = "nwscript.call(\"DelayCommand\", ...)"
module = "routines"
params = [
  { name = "seconds", type = "float" },
  { name = "action", type = "any" },
]
returns = "nothing"
failure = "error"
on_failure = "'DelayCommand takes a script closure and cannot be called from Lua. Use kp.timer.after(ms, function() ... end).'"
requires = "none"
mechanism = "the dispatcher rejects this excluded catalog name before VM dispatch"
doc = "Same closure problem as AssignCommand. kp.timer.after is the replacement and takes milliseconds."
confidence = "high"

[[function]]
lua_name = "nwscript.call(\"ActionDoCommand\", ...)"
module = "routines"
params = [{ name = "action", type = "any" }]
returns = "nothing"
failure = "error"
on_failure = "'ActionDoCommand takes a script closure and cannot be called from Lua. Use kp.timer.after_ticks(1, function() ... end).'"
requires = "none"
mechanism = "the dispatcher rejects this excluded catalog name before VM dispatch"
doc = """Same closure problem. Queueing work onto an object's action queue from
outside is not possible; running it next frame is, and is usually what was meant."""
confidence = "medium"

[[function]]
lua_name = "kp.as"
module = "routines"
params = [
  { name = "object_id", type = "object" },
  { name = "body", type = "function" },
]
variadic = true
returns = "any"
failure = "error"
on_failure = """'kp.as needs the VM binding' before hooks install; an error raised
inside body propagates after the caller fields are restored"""
requires = "vm"
mechanism = """writes CSWVirtualMachineCommands.has_caller_object +0x04 and
caller_object_id +0x08, calls body, then restores both to what they were"""
doc = """Runs a function with OBJECT_SELF set to an object. This is the generic
replacement for AssignCommand, and it is worth more than that sounds: most K1
routines default an object parameter to OBJECT_SELF, and every Action* routine
queues onto OBJECT_SELF's queue. Inside kp.as, nwscript.call("ClearAllActions")
clears that object's actions and nwscript.call("SpeakString", ...) speaks as it.

The previous values are saved and restored around the call, including when body
raises, so nesting is safe and an error does not leave the VM retargeted.

Confidence is medium on purpose. The mechanism is proven for
ExecuteCommandClearAllActions, whose decompiled body reads exactly these two
fields; that every routine honours them the same way is inference until it is
watched happening."""
confidence = "medium"
evidence = "ExecuteCommandClearAllActions 0x0052f4a0: `if (this->has_caller_object != 0) { id = this->caller_object_id; ... }`"

