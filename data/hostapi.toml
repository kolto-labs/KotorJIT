# =============================================================================
# timers -- and the replacement for the three routines Lua cannot call
# =============================================================================
# AssignCommand, DelayCommand and ActionDoCommand each take an `action`: a script
# closure the NWScript compiler builds as STORE_STATE bytecode capturing a
# subroutine and its frame. There is no way to synthesise one from outside the
# VM, so those three are the only K1 routines the bridge cannot call. They are
# not a gap to work around; they are two separate features that Lua does better
# natively:
#
#   DelayCommand(f, action)     -> kp.timer.after(ms, function() ... end)
#   AssignCommand(obj, action)  -> kp.as(obj, function() ... end)
#
# The clock. kp.timer runs on app.server_main_loop, which is the server tick. It
# stops when the game is paused and it stops in menus, which is usually what a
# script wants and is NOT wall time. kp.time() is wall time; kp.timer.tick() is
# the tick counter. All three are different questions and none of them is a
# substitute for another.
#
# Timers do not survive a save. They hold a Lua closure and a closure cannot be
# serialised. OnSave and OnLoad are the persistence path: save what you need to
# rebuild the timer, and rebuild it in OnLoad.

[[function]]
lua_name = "kp.timer.after"
module = "timers"
params = [
  { name = "delay_ms", type = "int" },
  { name = "callback", type = "function" },
  { name = "userdata", type = "any", optional = true, default = "nil" },
]
returns = "int"
failure = "error"
on_failure = "'delay must be zero or more' for a negative delay; a non-function, non-string callback is an argument error"
requires = "none"
mechanism = "the app.server_main_loop detour drains a per-script due list each tick"
doc = """Runs a callback once, after a delay in server-clock milliseconds. The
callback receives (id, count, userdata). Unlike Phasor this takes a function
value, so a typo is caught at registration rather than when the timer fires; a
string naming a global is still accepted for Phasor parity and still resolves
late. Returning true from the callback re-arms it, as Phasor does."""
confidence = "high"

[[function]]
lua_name = "kp.timer.every"
module = "timers"
params = [
  { name = "interval_ms", type = "int" },
  { name = "callback", type = "function" },
  { name = "userdata", type = "any", optional = true, default = "nil" },
]
returns = "int"
failure = "error"
on_failure = "'interval must be one or more'; an interval of zero would fire forever inside one tick"
requires = "none"
mechanism = "as kp.timer.after, re-armed after each call"
doc = """Runs a callback repeatedly. Return false from the callback to stop it.
Ticks are not evenly spaced, so a slow frame does not fire the timer twice to
catch up -- it fires once and the next due time is measured from now."""
confidence = "high"

[[function]]
lua_name = "kp.timer.after_ticks"
module = "timers"
params = [
  { name = "ticks", type = "int" },
  { name = "callback", type = "function" },
  { name = "userdata", type = "any", optional = true, default = "nil" },
]
returns = "int"
failure = "error"
on_failure = "'ticks must be one or more'"
requires = "none"
mechanism = "tick counter comparison in the app.server_main_loop detour"
doc = """Runs a callback after a number of server frames. Use this rather than a
