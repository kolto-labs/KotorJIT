confidence = "high"

[[function]]
lua_name = "kp.mem.allow_code_writes"
module = "memory"
params = [{ name = "enable", type = "bool" }]
returns = "bool"
failure = "never"
on_failure = "returns the previous setting"
requires = "none"
mechanism = "per-script flag on the write guard"
doc = """Lets this script's raw writes touch executable sections. Off by default
and per script, not global. Equivalent to declaring `allow_code_writes = true` at
chunk scope, which is read at load time the way `priority` is; this is the same
switch thrown later. The honest use is a one-off byte patch the address tables do
not cover; the dishonest use is anything you would rather do with a hook site."""
confidence = "high"

# =============================================================================
# structs -- named field access, generated from the RE corpus
# =============================================================================
# What the Phasor idiom looks like today, from the reference corpus:
#
#     stats_player_kills = readword(stats_base + 0x8)    -- Confirmed.
#
# The offset is a literal, the type is chosen by which function you called, and
# "Confirmed" is a comment. Nothing checks any of it, and two scripts in the same
# corpus disagree about the same offset.
#
# What replaces it:
#
#     local c = kp.struct.view(id)          -- picks CSWSCreature from the type byte
#     print(c.object.current_hp, c.object.position.x)
#     c.movement_rate_factor = 1.2          -- refused: engine setter clamps, use the effect
#
# The layouts come from data/structs/<game>.json, which carries every field's
# name, offset, type, size checksum and confidence, and is emitted from the same
# corpus that produced the address tables. tools/gen_struct_glue.py turns it into
# src/generated/structs_<game>.inc. Adding a struct is a data change.
#
# Three things this buys that the offset idiom cannot:
#
#   * A misspelled field raises and names the struct. An offset typo reads
#     whatever is next door.
#   * A view holds an object id and re-resolves it, so it cannot outlive its
#     object. A bare address can and does.
#   * Embedded bases are data. CSWSItem carries its CSWSObject at +0x10 while
#     every other type carries it at +0x00, so `item.server_object.current_hp`
#     resolves to +0xEC and `door.object.current_hp` to +0xDC without either
#     script knowing there was a difference.

[[function]]
lua_name = "kp.struct.view"
module = "structs"
params = [
  { name = "object_id", type = "object" },
  { name = "type_name", type = "string", optional = true, default = "chosen from the object's type byte" },
]
returns = "view"
failure = "nil"
on_failure = "nil when the id does not resolve, or when the object's type has no layout in data/structs"
requires = "server_tick"
mechanism = "kp.obj.address, then CGameObject.object_type +0x08 selects the layout"
doc = """Typed view of a live object. Index it by field name. Pass type_name to
force a layout, which is how you look at a subobject the type byte does not
describe."""
confidence = "high"

[[function]]
