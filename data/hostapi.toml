# =============================================================================
# object -- identity, lookup and the things every script does with an id
# =============================================================================
# KOTOR object ids are not a flat counter. CGameObjectArray::AddInternalObject
# hands normal objects an id from next_object_id_0 counting up and character
# objects one from next_char_id_0 counting down, so the two ranges grow toward
# each other. Nothing here assumes an id is small, dense, or ordered.
#
# The receiver problem, stated once: the typed lookups on CServerExoAppInternal
# need that object as `this`, and the corpus has no data-symbol table to resolve
# a global from. The app.server_main_loop detour IS a CServerExoAppInternal
# method, so its `this` is the receiver, captured on the first tick. That is why
# the address lookups here say requires = "server_tick" and return their
# documented failure value before then, while the entries that go through an
# engine routine only need the VM binding. It is a real state, not an edge case:
# OnScriptLoad runs before the first tick.

