# --- Per-object typed event handlers -----------------------------------------
# One logical cave, ten sites. Signatures differ per type, so each is declared
# separately and each gets its own verified prototype before it is hooked.

[[site]]
name = "event.creature"
class = "CSWSCreature"
method = "EventHandler"
kind = "detour"
required = true
convention = "thiscall"
purpose = "undefined __thiscall(this, int eventType, int* eventData, CSWSObject* caller)"

