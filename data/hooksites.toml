convention = "thiscall"

[[site]]
name     = "msg.change_door_state"
class    = "CSWCMessage"
method   = "SendPlayerToServerInput_ChangeDoorState"
kind     = "call"
required = false
purpose  = "(this, uint32 door, int state) -> void. Retail state 0x2725 dispatches category 6/subtype 3 to queue normal door use; dispatch is not completion."
convention = "thiscall"

[[site]]
name     = "door.move_to_next_open_state"
class    = "CSWSDoor"
method   = "MoveToNextOpenState"
kind     = "call"
required = false
purpose  = "(this) -> void. Phase two of door opening: copies the pending also_open_state (+0x2cd) into the committed open_state (+0x2cc, what GetIsOpen and the walkmesh read) and updates the area walkmesh. Retail reaches it only from the client's model-animation-done callback (CSWCDoor::MoveNextDoorState), which the headless client never delivers for some doors; door_commit_open calls it once a door is stuck with +0xd4 opening and +0x2cc still 0."
convention = "thiscall"

[[site]]
name   = "door.open_state"
class  = "CSWSDoor"
method = "open_state"
kind   = "field"
required = false
purpose = "Committed door state byte (+0x2cc): 0 closed, 1 open1, 2 open2, 3 destroyed. GetIsOpen and the walkmesh read this one; SetOpenState writes it only when its pending flag is 0, otherwise MoveToNextOpenState commits it from also_open_state."

[[site]]
name   = "door.also_open_state"
class  = "CSWSDoor"
method = "also_open_state"
kind   = "field"
required = false
purpose = "Pending door state byte (+0x2cd). SetOpenState writes it on every call; a door is mid-transition while it differs from open_state. Read with door.open_state to decide whether door_commit_open is due."

[[site]]
name   = "door.animation"
class  = "CSWSDoor"
method = "animation"
kind   = "field"
required = false
purpose = "Engine animation id (+0xd4, inherited CSWSObject::animation) last set through the SetAnimation vtable slot. SetOpenState sets 0x2726 closed, 0x2742 open1, 0x2743 open2, 0x2758 destroyed; door_commit_open checks it against these before committing."

[[site]]
name     = "msg.area_loaded"
class    = "CSWCMessage"
method   = "SendPlayerToServerArea_AreaLoaded"
kind     = "call"
required = false
purpose  = "PlayerToServer Area minor 3. The client sends it when the load's work counter reaches its total, which never happens headless, so the harness sends it once to release MovePlayerToArea. Takes no argument: 0x006778f0 ends in a bare `ret` and reaches the net layer through g_pAppManager, never through ecx."
convention = "stdcall"

