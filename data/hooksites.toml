class    = "CNetLayer"
method   = "Initialize"
kind     = "reference"
required = false
purpose  = "Pairs the stock in-process CNetLayer endpoints; transport replacement must preserve lifecycle and ownership semantics."
convention = "thiscall"

[[site]]
