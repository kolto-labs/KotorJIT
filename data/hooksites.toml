# --- Per-object typed event handlers -----------------------------------------
# One logical cave, ten sites. Signatures differ per type, so each is declared
# separately and each gets its own verified prototype before it is hooked.

[[site]]
name = "event.creature"
class = "CSWSCreature"
method = "EventHandler"
kind = "detour"
# Deliberately NOT required. Six creature script slots -- heartbeat, spawn,
# damaged, end-of-round, death and end-of-dialogue -- never reach this handler
# at all; the engine runs them from elsewhere. For creature events vm.run_script
# is strictly the richer site, and refusing to install without this one would
# trade real coverage for none.
required = false
convention = "thiscall"
# Five parameters, not three:
#   (nEventId, nCallerObjectId, void* pEventData, nCalendarDay, nTimeOfDay)
# The payload type varies by event id -- CVirtualMachineScript, CScriptEvent,
# CSWSSpellScriptData, CSWSCombatAttackData or CSWCCMessageData.
purpose = "__thiscall(this, int nEventId, ulong nCaller, void* pEventData, ulong day, ulong time)"

