# --- Tick, console, module lifecycle -----------------------------------------

[[site]]
name     = "app.server_main_loop"
class    = "CServerExoAppInternal"
method   = "MainLoop"
kind     = "detour"
required = true
purpose  = "Per-tick scheduler: Lua timers and coroutine resume."
convention = "thiscall"

[[site]]
name     = "app.client_main_loop"
class    = "CClientExoAppInternal"
method   = "MainLoop"
kind     = "detour"
required = false
purpose  = """Client/render tick. WinMain calls it every iteration, server or no
server, so it is the only per-frame site that runs on the main menu. The
headless harness drains its command queue here, re-applies the world-timer
scale after the engine's per-frame SetGameSpeed, and reads the frame for a
screenshot after the original returns. Returning 1 is a clean quit: WinMain
ORs the return into its exit flag."""
# int __thiscall MainLoop(this) on the PE builds. On the native kotor2 ELF
# `this` is the first stack argument (GCC cdecl); the body picks the shape from
# the table's platform.
convention = "thiscall"

[[site]]
name     = "console.do_console"
class    = ""
method   = "DoConsole"
kind     = "detour"
required = true
purpose  = """In-game cheat console. Intercepts the whole input line, including
commands the game does not recognise - which registration-based extension cannot do.
Also the headless demo surface."""

[[site]]
name     = "console.funcs_add"
class    = ""
method   = "ConsoleFuncs_Add"
kind     = "call"
required = false
purpose  = "Register native console commands."

[[site]]
name     = "module.load_start"
class    = "CSWSModule"
method   = "LoadModuleStart"
kind     = "detour"
required = false
purpose  = "Module lifecycle boundary; script reload point. Spare sixth cave."
convention = "thiscall"

# --- Headless harness: engine calls ------------------------------------------
#
# Sites the harness adapter (src/harness/engine_*.cpp) calls or reads. None is
# required: a build that lacks one makes the matching command reply
# `unsupported` with the site named, and every other command keeps working.
# Calling conventions below are what the K1 corpus records and are advisory;
# the adapter hardcodes the shape per call and per platform (docs/harness-design.md,
# reverse-engineering amendment 6).

[[site]]
name     = "client.set_game_speed"
class    = "CClientExoAppInternal"
method   = "SetGameSpeed"
kind     = "detour"
required = false
purpose  = """SetSnapshotScale on the five game-speed timers (client world, pause,
animation; server world, pause). The client loop calls it every non-loading
frame with 1.0 or 0.25, which would clobber a harness scale; the detour lets the
engine's call through and applies the harness scale after it."""
# void __thiscall SetGameSpeed(this, float scale)
convention = "thiscall"

[[site]]
name     = "client.play_movies"
class    = "CClientExoAppInternal"
method   = "PlayMoviesInExoArrayList"
kind     = "detour"
required = false
purpose  = """Every movie (intro queue, module transitions, script PlayMovie) funnels
through here and blocks the client loop inside WaitForMovie until it ends. With
movies disabled the detour returns 0 without touching *outResult, which is the
engine's own disable_movies path."""
# int __thiscall PlayMoviesInExoArrayList(this, CExoArrayList<CExoString>*, int* outResult,
#                                          int wait, int, CExoArrayList<int>*)  -- ret 0x14
convention = "thiscall"

[[site]]
name     = "creature.ai_action_move_to_point"
class    = "CSWSCreature"
method   = "AIActionMoveToPoint"
kind     = "detour"
required = false
purpose  = "K1 shared MoveToPoint action trace. Observes only mapped +0x1f8/+0xa8c suppression and +0x340 path-context fields before forwarding unchanged; it does not duplicate or classify engine predicates."
convention = "thiscall"

[[site]]
name     = "creature.add_move_to_point_action"
class    = "CSWSCreature"
method   = "AddMoveToPointAction"
kind     = "detour"
required = false
purpose  = "Split-client input seam: replicate the native MoveToPoint action arguments to the authoritative server, which replays the same engine action on the matching player creature."
convention = "thiscall"

[[site]]
name     = "server_object.set_position"
class    = "CSWSObject"
method   = "SetPosition"
kind     = "call"
required = false
purpose  = "Authoritative split-server position update; updates the object's area index without requiring the retail client-coupled pathfinding tick."
convention = "thiscall"

[[site]]
name     = "app.create_server"
class    = "CAppManager"
method   = "CreateServer"
kind     = "call"
required = false
purpose  = "New CServerExoApp plus StartServices/Initialize; replaces an existing server. First step of the load-save replay."
convention = "thiscall"

[[site]]
name     = "net.start_connect_to_session"
class    = "CNetLayer"
method   = "StartConnectToSession"
kind     = "detour"
required = false
purpose  = "Loopback connect: (net, 0, &clientName, &\"\", 10, 0x10). Flag 0x10 makes the local player sys-admin, which is what lets the automatic \"sModule.Run\" reach RunModule."
# bool __thiscall StartConnectToSession(this, ulong, CExoString*, CExoString*, ulong, ulong)
convention = "thiscall"

# Multiplayer transport boundary. A build with its own verified ABI receipt
# enables the detours only for an
# explicitly named client/server executable with a configured loopback port;
# other builds remain runtime-disabled until their own ABI receipts exist.
