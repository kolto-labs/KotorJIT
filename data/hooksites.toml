# KotorPhasor hook site manifest.
#
# Sites are named LOGICALLY (class + method). Addresses never appear here — they
# are resolved per build by tools/gen_address_tables.py against the RE corpus and
# emitted to data/addresses/<build>.json. Adding a game build is a data change.
#
# `required` sites must resolve or the runtime refuses to install on that build.
# `optional` sites degrade gracefully: the feature they carry is disabled.

[meta]
version = 1

# --- The script VM: the backbone of the event pipeline ------------------------

[[site]]
name     = "vm.run_script"
class    = "CVirtualMachineInternal"
method   = "RunScript"
kind     = "detour"
required = true
purpose  = """Every NWScript event the engine fires funnels through here. Yields the
script name and owning object, and allows observe / block / override."""
# int __thiscall RunScript(this, CExoString* name, ulong objectId, int hasObject)
convention = "thiscall"
returns    = "int"

[[site]]
name     = "vm.run_script_situation"
class    = "CVirtualMachineInternal"
method   = "RunScriptSituation"
kind     = "detour"
required = false
purpose  = "Resumed/delayed scripts (DelayCommand, AssignCommand)."
convention = "thiscall"

[[site]]
name     = "vm.execute_code"
class    = "CVirtualMachineInternal"
method   = "ExecuteCode"
kind     = "reference"
required = false
purpose  = "Bytecode interpreter loop. Referenced for diagnostics, not hooked in M1."
convention = "thiscall"

[[site]]
name     = "vm.execute_command"
class    = "CSWVirtualMachineCommands"
method   = "ExecuteCommand"
kind     = "reference"
required = true
purpose  = """Engine-routine dispatch. NOT hooked - we write entries in the runtime
function-pointer table it indexes. Resolved so we can locate that table."""
convention = "thiscall"

# --- Script state persistence -------------------------------------------------

[[site]]
name     = "vm.save_script_situation"
class    = "CVirtualMachineInternal"
method   = "SaveScriptSituation"
kind     = "detour"
required = false
purpose  = "Persist Lua-owned state alongside the engine's script state on save."
convention = "thiscall"

[[site]]
name     = "vm.load_script_situation"
class    = "CVirtualMachine"
method   = "LoadScriptSituation"
kind     = "detour"
required = false
purpose  = "Restore Lua-owned state on load."
convention = "thiscall"

