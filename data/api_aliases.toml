# Alternate spellings for names this host actually registers.
#
# Canonical names come from the C modules and the NWScript bridge, which
# follow the Ghidra / kotorxid names: kotor.mem.readbyte, kotor.GetFirstPC,
# kotor.SendMessageToPC, kotor.registertimer. Scripts also write the
# underscored form (read_byte, register_timer). Both point at the same C
# function.
#
# Do not add Halo names here (getplayer, getobject, say_all, EVENT_JOIN).
# The local client is GetFirstPC / CServerExoApp::GetPlayerCreatureId.
# Client attach/leave are OnModulePlayerEnter (Mod_OnClientEntr) and
# OnModulePlayerExit (Mod_OnClientLeav) in data/events.toml.
#
# Event constants are not listed here. tools/gen_compat.py reads
# data/events.toml and installs cb.<LuaName> for every catalog event.

version = 1

