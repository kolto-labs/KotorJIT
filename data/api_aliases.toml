# Two naming dialects for one API.
#
# Scripts for this kind of runtime were written against one of two Halo server
# mods, and the two never agreed on names. One writes `readbyte`, `getplayer`,
# `say`; the other writes `read_byte`, `get_player`, `say_all`. Existing scripts
# and existing habits are split down that line, and a compatibility shim written
# in Lua -- which is how people currently paper over it -- costs a table lookup
# on every call and breaks whenever either side changes.
#
# So both dialects are native here. Every entry below is an alias installed
# alongside the canonical name, pointing at the same C function. A script author
# uses whichever they already know, and mixing them in one file is fine.
#
# `dialect` records where a name comes from, so the reference can say so and a
# script can ask. It does not restrict anything: every alias is always present.
#
#   canonical  the name this runtime documents
#   alias      the name being added
#   dialect    "phasor" | "sapp" | "both"
#   note       only when the mapping is not a straight rename

version = 1

# The alias list below runs in this order: raw memory (the largest group by call
# volume, where one dialect concatenates and the other underscores), then output,
# then entities and objects, then miscellany.
#
# Output collapses hardest. KOTOR is one machine, so the server-to-client
# distinctions the two mods drew -- say vs say_all vs rprint vs privatesay --
# all reach either the log or the in-game console here.
#
# --- events -------------------------------------------------------------------
#
# The two dialects disagree about more than names here. One expects a script to
# define `function OnTick()` and finds it by looking; the other expects
# `register_callback(cb.EVENT_TICK, "my_handler")` at runtime. Both work, and a
# script may use either or both.
#
# The mapping below is by MEANING, not by spelling. Several of these have no
# KOTOR counterpart at all -- there are no teams, no vehicles and no network
# players in a single-player RPG -- and those are recorded as unmapped rather
# than quietly bound to something that looks similar. A callback registered for
# an unmapped event never fires, and asking for it logs once saying so.

# Halo concepts with no KOTOR equivalent. Present as constants so a script that
# references one still loads, but never raised.

alias = [
  { canonical = "readbit", alias = "read_bit", dialect = "sapp" },
  { canonical = "readbyte", alias = "read_byte", dialect = "sapp" },
