# KotorPhasor event table -- DRAFT
#
# Derived from recovered C for K1 GOG (swkotor.exe, md5 9a44891011437deb6536d992bccdfe4b),
# corpus root:
#   /home/brunner56/biodecompwarehouse/kotorxid/output/kotor_readable/
#     K1__k1_win_gog_swkotor.exe/src/AspyrBuild/depot/KOTOR/PC_Source/Dev/
# All `file:line` citations below are relative to that root.
# All decompiled sources carry `authority: advisory-ghidra` -- readable, NOT byte-verified.
#
# Layer collisions -- 0xB, 0x1A and 0x1B each mean different things as an engine
# event id (outer_event_id) and as a CScriptEvent type (event_type). Never read
# one of these numbers without knowing which column it came from.
#
# Script event types 5 (ON_DISTURBED), 8 (ON_SPAWN_IN) and 9 (ON_RESTED) are named
# by the engine's log table but consumed by NO handler in any of the ten object
# types. They are omitted from this file deliberately.
#
# READ docs/event-semantics.md BEFORE USING THIS FILE. Two premises in the
# original brief are wrong and are corrected there:
#   1. CScriptEvent's four parameter blocks are CExoArrayList (data,size,capacity),
#      NOT fixed 3-element arrays. They are variable length. Bounds-check.
#   2. CSWSCreature::EventHandler does not branch on {0,1,2,4,5,8,9}. It branches on
#      {1,4,5,8,9,0xA,0xB,0xE,0xF,0x12,0x13,0x14,0x15,0x16,0x1B}.
#
# Field meanings
#   hook_site       name from data/hooksites.toml where this event is observable
#   outer_event_id  CServerAIMaster event id (arg 1 of EventHandler), if queue-delivered
#   event_type      CScriptEvent.event_type -- only meaningful when outer_event_id = 10
#   script_slot     GFF field name of the resref the engine runs
#   slot_index      index into the object's CExoString script array (the code-level truth)
#   default_script  hardcoded fallback found IN THE BINARY. Omitted where the only
#                   default is blueprint/template data, which is not in the executable.
#   args            what the handler has read by the time RunScript is called
#   returns         values the Lua handler may return that the engine can act on
#   fallback        value assumed when no Lua handler is registered
#   blocking        true = suppressing the RunScript call is survivable for the engine
#   engine_return   what the engine does with RunScript's result
#
# `source` values inside args:
#   "this"                the object whose EventHandler ran (RunScript's object id)
#   "caller"              arg 2 of EventHandler (nCallerObjectId)
#   "calendar_day"        arg 4
#   "time_of_day"         arg 5
#   "int_params[N]"       CScriptEvent::GetInteger(N)      -> 0 if N >= size
#   "float_params[N]"     CScriptEvent::GetFloat(N)        -> 0.0 if N >= size
#   "string_params[N]"    CScriptEvent::GetString(N)       -> "" if N >= size
#   "object_params[N]"    CScriptEvent::GetObjectID(N)     -> 0x7f000000 if N >= size

[meta]
version = 1
binary = "K1__k1_win_gog_swkotor.exe"
md5 = "9a44891011437deb6536d992bccdfe4b"
event_handler_signature = "void __thiscall EventHandler(this, ulong nEventId, ulong nCallerObjectId, void* pEventData, ulong nCalendarDay, ulong nTimeOfDay)"
event_handler_evidence = "game/servercore/nwsmodule.cpp:1130 and 9 sibling handlers; call sites game/servercore/serveraimaster.cpp:1004,1010,1016"
script_event_carrier = "outer_event_id 10 (EVENT_SIGNAL_EVENT) carries a CScriptEvent*; its event_type selects the script slot"

# =============================================================================
# LAYER 0 -- the VM itself. Everything funnels here.
# =============================================================================

[[event]]
lua_name    = "OnRunScript"
hook_site   = "vm.run_script"
object_type = "any"
script_slot = ""
args = [
  { name = "script_name", type = "string", source = "arg1 CExoString*" },
  { name = "object_id",   type = "object", source = "arg2 ulong" },
  { name = "has_object",  type = "int",    source = "arg3 int" },
]
returns   = ["bool"]
fallback  = "true"
blocking  = true
engine_return = "int: 1 = script loaded and ran with a balanced stack, 0 = did not run. Only one caller in the whole binary reads it (see OnDialogConditional)."
confidence = "high"
evidence  = "libsource/nwscript/nwvmachineinternal.cpp:005d45d0 body: returns 0 on empty name, on ReadScriptFile failure, or on stack imbalance; returns 1 after RunScriptFile succeeds. Stores a trailing INTEGER stack value into field1_0x1c=3/field2_0x20 for GetRunScriptReturnValue."
notes = "This is the only universal chokepoint. Several script slots (creature heartbeat, spawn, damaged, death, endround, enddialogue) are reachable ONLY here -- they never pass through any EventHandler."

