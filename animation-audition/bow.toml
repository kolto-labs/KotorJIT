# Deploy two_actor_bow.lua. Use the creative driver for client tick helpers.
# Camera/free-look staging is external; this route proves clocks, not visual pose.
name = "native animation: two actor freeze"
target = "k1"
[settings]
game_speed = 1.0
hang_seconds = 90
default_timeout = 120
load_timeout = 600

[[step]]
do = "load_save"
dir = "000001 - AUTOSAVE"
timeout = 600

[[step]]
wait = "phase"
equals = "gameplay"
timeout = 600

[[step]]
do = "clear_auto_pause"

[[step]]
do = "advance_dialog"
until = "gameplay"
timeout = 120

[[step]]
do = "mark_log"

[[step]]
label = "native API available and peaceful player"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); return kp.animation.capabilities().available and nwscript.call('GetIsInCombat',p)==0 and nwscript.call('GetIsInConversation',p)==0"
equals = true

[[step]]
label = "record pre-existing area objects"
do = "assert_lua"
code = "_G.anim_existing={}; _G.anim_caps={}; local p=nwscript.call('GetFirstPC'); local a=nwscript.call('GetArea',p); local o=nwscript.call('GetFirstObjectInArea',a,1); while nwscript.call('GetIsObjectValid',o)==1 do anim_existing[o]=true; o=nwscript.call('GetNextObjectInArea',a,1) end; return true"
equals = true

[[step]]
do="lua"
code="local p=nwscript.call('GetFirstPC'); nwscript.call('SetCameraMode',p,2); nwscript.call('SetCameraFacing',nwscript.call('GetFacing',p))"
[[step]]
do="advance_ticks"
ticks=180
[[step]]
do="capture_free_look"
[[step]]
do="advance_ticks"
ticks=120
[[step]]
do="console_open"
open=true
[[step]]
do="console_command"
code="dofile(\"kotorphasor/console-examples/two_actor_bow.lua\"); function animation_tick() OnTick(); local p=nwscript.call(\"GetFirstPC\"); return nwscript.call(\"GetLocalNumber\",p,7)~=1 and nwscript.call(\"GetLocalNumber\",p,8)~=1 end; return type(OnTick)"
contains=["string: function"]
[[step]]
do="console_command"
code="local p=nwscript.call(\"GetFirstPC\"); nwscript.call(\"SetLocalNumber\",p,7,0); nwscript.call(\"SetLocalNumber\",p,8,0); nwscript.call(\"SetLocalNumber\",p,5,8); animation_clock=kp.registertimer(16,\"animation_tick\"); return animation_clock>0"
contains=["boolean: true"]
[[step]]
do="console_open"
open=false

[[step]]
label = "capture two new friendly actors with active baseline"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); if nwscript.call('GetLocalNumber',p,6)~=2 then return false end; local a=nwscript.call('GetArea',p); local o=nwscript.call('GetFirstObjectInArea',a,1); local n=0; while nwscript.call('GetIsObjectValid',o)==1 do if not anim_existing[o] then assert(nwscript.call('GetStandardFaction',o)==2 and nwscript.call('GetIsInCombat',o)==0); local c=assert(kp.model.snapshot(o,assert(kp.model.identify(o)))); assert(kp.animation.inspect(c,'pause1').active); anim_caps[o]=c; n=n+1 end; o=nwscript.call('GetNextObjectInArea',a,1) end; return n==2"
equals = true
poll = true
timeout = 30

[[step]]
label = "both native dance clocks advance from zero"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); if nwscript.call('GetLocalNumber',p,6)~=3 then return false end; for _,c in pairs(anim_caps) do local s=assert(kp.animation.inspect(c,'bow')); if not s.active or s.time<0.05 then return false end end; return true"
equals = true
poll = true
timeout = 30

[[step]]
label = "sample the held actor and comparison actor"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); if nwscript.call('GetLocalNumber',p,6)~=4 then return false end; _G.anim_hold={}; for id,c in pairs(anim_caps) do local s=assert(kp.animation.inspect(c,'bow')); assert(s.active); anim_hold[id]=s.time end; return true"
equals = true
poll = true
timeout = 30

[[step]]
label = "client frames advance while held"
do = "advance_ticks"
clock = "client"
ticks = 12
timeout = 15

[[step]]
label = "one clock stays fixed while the other progresses"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); assert(nwscript.call('GetLocalNumber',p,6)==4,'hold window missed'); local held,moving=0,0; for id,c in pairs(anim_caps) do local s=assert(kp.animation.inspect(c,'bow')); assert(s.active); local d=s.time-anim_hold[id]; if math.abs(d)<0.002 then held=held+1; _G.anim_held_id=id; _G.anim_held_time=s.time elseif d>0.02 then moving=moving+1 end end; return held==1 and moving==1"
equals = true

[[step]]
label = "held actor resumes its existing clock"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); if nwscript.call('GetLocalNumber',p,6)~=5 then return false end; local s=assert(kp.animation.inspect(anim_caps[anim_held_id],'bow')); return s.active and s.time>anim_held_time+0.03"
equals = true
poll = true
timeout = 30

[[step]]
label = "both owned actors reset to known pause1 baseline"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); if nwscript.call('GetLocalNumber',p,6)~=6 then return false end; for _,c in pairs(anim_caps) do assert(kp.animation.inspect(c,'pause1').active) end; return true"
equals = true
poll = true
timeout = 30

[[step]]
label = "successful completion and exact owned actor removal"
do = "assert_lua"
code = "local p=nwscript.call('GetFirstPC'); assert(nwscript.call('GetLocalNumber',p,8)==0,'scene failed'); if nwscript.call('GetLocalNumber',p,7)~=1 then return false end; for id in pairs(anim_caps) do assert(nwscript.call('GetIsObjectValid',id)==0) end; for id in pairs(anim_existing) do assert(nwscript.call('GetIsObjectValid',id)==1) end; return true"
equals = true
poll = true
timeout = 30

[[step]]
do = "await_log"
pattern = "\\[animation-scene:freeze\\] complete owned=2 baseline=pause1"
minimum = 1
maximum = 1

[[step]]
do="console_open"
open=true
[[step]]
do="console_command"
code="OnScriptUnload(); OnTick=nil; OnScriptUnload=nil; animation_tick=nil; return true"
contains=["boolean: true"]
[[step]]
do="console_open"
open=false
