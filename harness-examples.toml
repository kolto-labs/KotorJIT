[[step]]
label = "snapshot actual stocked metalbox items before queue"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); local a=nwscript.call(\"GetArea\",pc); local best,dist=nil,1e9; local o=nwscript.call(\"GetFirstObjectInArea\",a,64); while nwscript.call(\"GetIsObjectValid\",o)==1 do if nwscript.call(\"GetTag\",o):gsub(\"%z\",\"\")==\"metalbox\" and nwscript.call(\"GetIsObjectValid\",nwscript.call(\"GetFirstItemInInventory\",o))==1 then local d=nwscript.call(\"GetDistanceBetween\",pc,o); if d<dist then best,dist=o,d end end; o=nwscript.call(\"GetNextObjectInArea\",a,64) end; if not best then return false end; validation_loot={box=best,items={},gold=nwscript.call(\"GetGold\",pc)}; local it=nwscript.call(\"GetFirstItemInInventory\",best); while nwscript.call(\"GetIsObjectValid\",it)==1 do validation_loot.items[#validation_loot.items+1]={id=it,tag=nwscript.call(\"GetTag\",it):gsub(\"%z\",\"\")}; it=nwscript.call(\"GetNextItemInInventory\",best) end; return #validation_loot.items>0"
equals = true
