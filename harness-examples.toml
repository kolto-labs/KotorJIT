code = "local pc=nwscript.call(\"GetFirstPC\"); local d=nwscript.call(\"GetObjectByTag\",\"end_door05\",0); return nwscript.call(\"GetDistanceBetween\",pc,d)<=1.75"
equals = true
poll = true
timeout = 120

