[[step]]
label = "actual example 20_dialog_state.lua default"
do = "lua"
code = "validation_results=validation_results or {}; validation_results[\"20\"]=(function()\n-- Conversation state from the engine's side. Pair it with the harness\n-- `state` command's `dialog` block (entry, waiting_for_player,\n-- waiting_on_sound, replies), which reads the GUI panel.\n--\n-- A conversation that shows active=1 here while the panel has entry=-1 and\n-- nobody is in it (pc_in=0, partner_in=0) is still initialising: the owner\n-- has not sent its first entry. `dialog_skip` fails on it (\"dialog owner has\n-- no game object\"); wait, then escalate to `dialog_abort` if it never starts.\n\nlocal PARTNER_TAG = \"end_trask\"\n\nlocal function clean(s) return (s:gsub(\"%z\", \"\")) end\n\nlocal pc = nwscript.call('GetFirstPC')\nlocal partner = nwscript.call('GetObjectByTag',PARTNER_TAG, 0)\n\nlocal out = {\n  active = nwscript.call('GetIsConversationActive'),\n  pc_in = nwscript.call('GetIsInConversation',pc),\n  last_speaker = clean(nwscript.call('GetTag',nwscript.call('GetLastSpeaker'))),\n  pc_speaker = clean(nwscript.call('GetTag',nwscript.call('GetPCSpeaker'))),\n  pc_action = nwscript.call('GetCurrentAction',pc),\n}\nif nwscript.call('GetIsObjectValid',partner) == 1 then\n  out.partner_in = nwscript.call('GetIsInConversation',partner)\n  out.partner_action = nwscript.call('GetCurrentAction',partner)   -- 7 == dialog object\n  out.partner_dist = nwscript.call('GetDistanceBetween',pc, partner)\nend\nreturn out\n\nend)(); return validation_results[\"20\"]"
timeout = 60

[[step]]
label = "dialog snapshot has valid NW integer state"
do = "assert_lua"
code = "local r=validation_results[\"20\"]; return (r.active==0 or r.active==1) and (r.pc_in==0 or r.pc_in==1) and type(r.partner_dist)==\"number\""
equals = true
poll = false
timeout = 30

[[step]]
do = "clear_auto_pause"

[[step]]
do = "advance_dialog"
until = "gameplay"
timeout = 120

[[step]]
label = "actual example 10_world_probe.lua default"
do = "lua"
code = "validation_results=validation_results or {}; validation_results[\"10\"]=(function()\n-- World probe: where the PC is, who is hostile nearby, what the party looks\n-- like. One round trip; everything a combat or movement decision needs.\n--\n-- Returns:\n--   pc        {x, y, z, hp, max_hp, in_combat, action, commandable}\n--   hostiles  [{id, tag, hp, dist, action}], nearest first, within RADIUS\n--   party     [{id, tag, hp, dist, action}] for the other party members\n--   globals   the END_* room counters that gate the Endar Spire doors\n\nlocal RADIUS = 60.0\n\nlocal function clean(s) return (s:gsub(\"%z\", \"\")) end\n\nlocal pc = nwscript.call('GetFirstPC')\nlocal area = nwscript.call('GetArea',pc)\nlocal p = nwscript.call('GetPosition',pc)\n\nlocal out = {\n  pc = {\n    x = p.x, y = p.y, z = p.z,\n    hp = nwscript.call('GetCurrentHitPoints',pc),\n    max_hp = nwscript.call('GetMaxHitPoints',pc),\n    in_combat = nwscript.call('GetIsInCombat',pc),\n    action = nwscript.call('GetCurrentAction',pc),\n    commandable = nwscript.call('GetCommandable',pc),\n  },\n  hostiles = {},\n  party = {},\n  globals = {},\n}\n\n-- 1 == OBJECT_TYPE_CREATURE\nlocal c = nwscript.call('GetFirstObjectInArea',area, 1)\nwhile nwscript.call('GetIsObjectValid',c) == 1 do\n  if c ~= pc then\n    local d = nwscript.call('GetDistanceBetween',pc, c)\n    local row = { id = c, tag = clean(nwscript.call('GetTag',c)),\n                  hp = nwscript.call('GetCurrentHitPoints',c), dist = d,\n                  action = nwscript.call('GetCurrentAction',c) }\n    if nwscript.call('GetIsEnemy',c, pc) == 1 and nwscript.call('GetIsDead',c) == 0 and d <= RADIUS then\n      out.hostiles[#out.hostiles + 1] = row\n    elseif nwscript.call('IsObjectPartyMember', c) == 1 then\n      out.party[#out.party + 1] = row\n    end\n  end\n  c = nwscript.call('GetNextObjectInArea',area, 1)\nend\ntable.sort(out.hostiles, function(a, b) return a.dist < b.dist end)\n\nfor _, g in ipairs({ \"END_ROOM3_DEAD\", \"END_ROOM5_DEAD\", \"END_ROOM7_DEAD\",\n                     \"END_ROOM8_DEAD\", \"END_SITH_DEAD\", \"END_TRASK_DLG\",\n                     \"END_BRIDGE_SEALED\" }) do\n  out.globals[g] = nwscript.call('GetGlobalNumber',g)\nend\n\nreturn out\n\nend)(); return validation_results[\"10\"]"
timeout = 60

[[step]]
label = "world result invariants and actual PC HP"
do = "assert_lua"
code = "local r=validation_results[\"10\"]; local pc=nwscript.call(\"GetFirstPC\"); if r.pc.hp~=nwscript.call(\"GetCurrentHitPoints\",pc) or type(r.globals.END_ROOM3_DEAD)~=\"number\" then return false end; local prev=-1; for _,o in ipairs(r.hostiles) do if o.dist<prev or o.dist>60 then return false end; prev=o.dist end; for _,o in ipairs(r.party) do if o.tag==\"end_trask\" then return true end end; return false"
equals = true
poll = false
timeout = 30

[[step]]
label = "actual example 60_area_dump.lua default"
do = "lua"
code = "validation_results=validation_results or {}; validation_results[\"60\"]=(function()\n-- Dump every object of one type in the PC's area: tag, position, distance,\n-- and for creatures hp/hostility/action. Use it to learn a room before\n-- writing route steps for it.\n--\n-- OBJECT_TYPE: 1 creature, 2 item, 4 trigger, 8 door, 32 waypoint, 64 placeable\n-- (nwscript.nss values). Doors are 8 in this engine's GetObjectType.\n\nlocal OBJECT_TYPE = 1\nlocal MAX = 40\n\nlocal function clean(s) return (s:gsub(\"%z\", \"\")) end\n\nlocal pc = nwscript.call('GetFirstPC')\nlocal area = nwscript.call('GetArea',pc)\nlocal rows = {}\nlocal o = nwscript.call('GetFirstObjectInArea',area, OBJECT_TYPE)\nwhile nwscript.call('GetIsObjectValid',o) == 1 and #rows < MAX do\n  local p = nwscript.call('GetPosition',o)\n  local row = { id = o, tag = clean(nwscript.call('GetTag',o)), name = clean(nwscript.call('GetName',o)),\n                x = p.x, y = p.y, z = p.z, dist = nwscript.call('GetDistanceBetween',pc, o) }\n  if OBJECT_TYPE == 1 then\n    row.hp = nwscript.call('GetCurrentHitPoints',o)\n    row.dead = nwscript.call('GetIsDead',o)\n    row.hostile = nwscript.call('GetIsEnemy',o, pc)\n    row.action = nwscript.call('GetCurrentAction',o)\n  elseif OBJECT_TYPE == 8 then\n    row.open = nwscript.call('GetIsOpen',o)\n    row.locked = nwscript.call('GetLocked',o)\n  end\n  rows[#rows + 1] = row\n  o = nwscript.call('GetNextObjectInArea',area, OBJECT_TYPE)\nend\ntable.sort(rows, function(a, b) return a.dist < b.dist end)\nreturn rows\n\nend)(); return validation_results[\"60\"]"
timeout = 60

[[step]]
label = "area dump sorted valid creatures and player present"
do = "assert_lua"
code = "local pc=nwscript.call(\"GetFirstPC\"); local seen=false; local prev=-1; for _,r in ipairs(validation_results[\"60\"]) do if r.dist<prev or nwscript.call(\"GetIsObjectValid\",r.id)~=1 then return false end; prev=r.dist; if r.id==pc then seen=true end end; return seen"
equals = true
poll = false
timeout = 30

[[step]]
label = "actual example 40_attack_nearest.lua default"
do = "lua"
code = "validation_results=validation_results or {}; validation_results[\"40\"]=(function()\n-- Attack the nearest live hostile within RADIUS, unless the PC is already\n-- fighting it. Re-issuing ActionAttack every poll restarts the combat round,\n-- so this is a no-op while the PC is mid-round (action 39) or already\n-- attacking (action 3).\n--\n-- After queueing, expect the engine's autopause to fire on the first combat\n-- event unless the ini disabled it: if the harness `state` shows\n-- phase=paused, send `clear_auto_pause` (it also unpauses the world timers,\n-- which is what actually lets rounds resolve).\n\nlocal RADIUS = 40.0\n\nlocal function clean(s) return (s:gsub(\"%z\", \"\")) end\n\nlocal pc = nwscript.call('GetFirstPC')\nlocal area = nwscript.call('GetArea',pc)\nlocal act = nwscript.call('GetCurrentAction',pc)\n\nlocal best, best_d = nil, RADIUS + 1\nlocal c = nwscript.call('GetFirstObjectInArea',area, 1)\nwhile nwscript.call('GetIsObjectValid',c) == 1 do\n  if nwscript.call('GetIsEnemy',c, pc) == 1 and nwscript.call('GetIsDead',c) == 0 then\n    local d = nwscript.call('GetDistanceBetween',pc, c)\n    if d <= RADIUS and d < best_d then best, best_d = c, d end\n  end\n  c = nwscript.call('GetNextObjectInArea',area, 1)\nend\n\nif best == nil then return { target = nil, reason = \"no live hostile in radius\" } end\nif act == 3 or act == 39 then\n  return { target = clean(nwscript.call('GetTag',best)), dist = best_d, reason = \"already engaged\", action = act }\nend\n\nnwscript.with_caller(pc, function()\n  nwscript.call('ClearAllActions')\n  nwscript.call('ActionAttack',best, 0)      -- 0 == no combat feat\nend)\nreturn { target = clean(nwscript.call('GetTag',best)), id = best, hp = nwscript.call('GetCurrentHitPoints',best), dist = best_d, queued = true }\n\nend)(); return validation_results[\"40\"]"
timeout = 60

[[step]]
label = "attack result documents queued, already engaged, or no enemy"
do = "assert_lua"
code = "local r=validation_results[\"40\"]; return r.queued==true or r.reason==\"already engaged\" or r.reason==\"no live hostile in radius\""
equals = true
poll = false
timeout = 30

[[step]]
label = "actual example 70_pc_status.lua default"
do = "lua"
code = "validation_results=validation_results or {}; validation_results[\"70\"]=(function()\n-- The PC in detail: hit points, active effects, equipped slots, inventory.\n-- Effects explain a creature that will not move or act (paralysis, cutscene\n-- holds); an empty list with commandable=1 means the block is elsewhere\n-- (paused world timers, see README).\n\nlocal function clean(s) return (s:gsub(\"%z\", \"\")) end\n\nlocal pc = nwscript.call('GetFirstPC')\nlocal out = {\n  hp = nwscript.call('GetCurrentHitPoints',pc),\n  max_hp = nwscript.call('GetMaxHitPoints',pc),\n  dead = nwscript.call('GetIsDead',pc),\n  commandable = nwscript.call('GetCommandable',pc),\n  in_combat = nwscript.call('GetIsInCombat',pc),\n  action = nwscript.call('GetCurrentAction',pc),\n  effects = {},\n  slots = {},\n  inventory = {},\n}\n\nlocal e = nwscript.call('GetFirstEffect',pc)\nwhile nwscript.call('GetIsEffectValid',e) == 1 do\n  out.effects[#out.effects + 1] = nwscript.call('GetEffectType',e)\n  e = nwscript.call('GetNextEffect',pc)\nend\n\n-- INVENTORY_SLOT_* 0..11; 4 is the right weapon on Endar's short sword.\nfor slot = 0, 11 do\n  local it = nwscript.call('GetItemInSlot',slot, pc)\n  if nwscript.call('GetIsObjectValid',it) == 1 then out.slots[\"slot\" .. slot] = clean(nwscript.call('GetTag',it)) end\nend\n\nlocal it = nwscript.call('GetFirstItemInInventory',pc)\nwhile nwscript.call('GetIsObjectValid',it) == 1 do\n  out.inventory[#out.inventory + 1] = { id = it, tag = clean(nwscript.call('GetTag',it)) }\n  it = nwscript.call('GetNextItemInInventory',pc)\nend\nreturn out\n\nend)(); return validation_results[\"70\"]"
timeout = 60

[[step]]
label = "PC status real HP, equipment and inventory"
do = "assert_lua"
code = "local r=validation_results[\"70\"]; local pc=nwscript.call(\"GetFirstPC\"); if r.hp~=nwscript.call(\"GetCurrentHitPoints\",pc) or r.max_hp~=nwscript.call(\"GetMaxHitPoints\",pc) then return false end; for key,tag in pairs(r.slots) do local slot=tonumber(key:sub(5)); local it=nwscript.call(\"GetItemInSlot\",slot,pc); if nwscript.call(\"GetTag\",it):gsub(\"%z\",\"\")~=tag then return false end end; for _,it in ipairs(r.inventory) do if nwscript.call(\"GetItemPossessor\",it.id)~=pc then return false end end; return true"
equals = true
poll = false
timeout = 30

